<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クロムハーツ 価格入力</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23fff'%3E%E2%9C%A0%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="CH価格入力">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0a0a0a; --sub:#7a7a7a; --line:#e4e4e4; --bg:#f4f4f4; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); font-size:16px; }
  header { background:#000; color:#fff; padding:18px 16px 14px; position:sticky; top:0; z-index:5; text-align:center; border-bottom:1px solid #2a2a2a; }
  header h1 { margin:0; font-family:"Cinzel",serif; font-weight:700; font-size:19px; letter-spacing:.28em; }
  header h1 .x { font-family:serif; margin:0 .45em; font-size:16px; vertical-align:1px; }
  header p { margin:6px 0 0; font-size:11px; color:#8a8a8a; letter-spacing:.12em; }
  main { padding:14px 16px 40px; max-width:560px; margin:0 auto; }
  .tabs { display:flex; border:1px solid #000; margin-bottom:14px; }
  .tabs button { flex:1; border:0; background:#fff; padding:11px; font-size:14px; color:#000; font-weight:600; letter-spacing:.06em; }
  .tabs button.on { background:#000; color:#fff; }
  .card { background:var(--card); padding:14px; margin-bottom:12px; border:1px solid var(--line); }
  label { display:block; font-size:12px; font-weight:700; margin:0 0 6px; letter-spacing:.08em; }
  label .opt { font-weight:400; color:var(--sub); margin-left:4px; }
  input, select { width:100%; font-size:16px; padding:11px 12px; border:1px solid #c8c8c8; border-radius:0; background:#fff; color:var(--ink); -webkit-appearance:none; appearance:none; }
  input[type=checkbox] { -webkit-appearance:auto; appearance:auto; accent-color:#000; }
  input:focus, select:focus { outline:none; border-color:#000; box-shadow:0 0 0 1px #000; }
  .field { margin-bottom:14px; }
  .field:last-child { margin-bottom:0; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:10px 0 2px; }
  .chips button { flex:none; border:1px solid #bdbdbd; background:#fff; padding:6px 12px; font-size:12px; color:#000; letter-spacing:.06em; }
  .chips button.on { background:#000; color:#fff; border-color:#000; }
  #list { margin-top:8px; max-height:46vh; overflow-y:auto; border-top:1px solid #000; }
  .item { padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:active { background:#efefef; }
  .item .n { font-size:15px; }
  .item .m { font-size:12px; color:var(--sub); margin-top:3px; letter-spacing:.02em; }
  .item .none { color:#b0b0b0; font-style:italic; }
  .empty { padding:16px 4px; color:var(--sub); font-size:14px; }
  .picked { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; border-left:3px solid #000; padding-left:10px; }
  .picked .n { font-weight:700; font-size:16px; }
  .picked .m { font-size:13px; color:var(--sub); margin-top:4px; line-height:1.5; }
  .linkbtn { flex:none; border:1px solid #000; background:#fff; color:#000; font-size:12px; padding:5px 10px; letter-spacing:.06em; }
  .price-wrap { position:relative; }
  .price-wrap span { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--sub); }
  .price-wrap input { padding-left:28px; font-size:22px; font-weight:700; letter-spacing:.03em; }
  .check { font-size:13px; margin-top:8px; line-height:1.5; min-height:1.5em; }
  .check.ok { color:#000; }
  .check.ng { color:#000; background:#ececec; padding:9px 10px 9px 12px; border-left:3px solid #000; font-weight:600; }
  .chk { display:flex; align-items:center; gap:8px; font-weight:400; font-size:13px; margin-top:12px; letter-spacing:0; }
  .chk input { width:18px; height:18px; }
  #send { width:100%; border:0; background:#000; color:#fff; font-size:16px; font-weight:700; letter-spacing:.3em; padding:16px; margin-top:4px; }
  #send:disabled { background:#cfcfcf; color:#f4f4f4; }
  .toast { margin-top:12px; padding:12px 12px 12px 14px; font-size:14px; line-height:1.5; border-left:3px solid #000; }
  .toast.ok { background:#fff; color:#000; border:1px solid #000; border-left-width:3px; }
  .toast.ng { background:#ececec; color:#000; font-weight:600; }
  [hidden] { display:none !important; }
</style></head>
<body>
<header><h1><span class="x">✠</span>CHROME HEARTS<span class="x">✠</span></h1><p>日本正規店 価格入力</p></header>
<main>
  <div class="tabs"><button id="tabUpd" class="on" type="button">価格を更新</button><button id="tabNew" type="button">新しい商品</button></div>

  <section id="secUpd">
    <div class="card" id="searchCard">
      <label for="q">商品をさがす</label>
      <input id="q" type="search" placeholder="例：ダガー、DAGGER、パーカー" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div id="list"><div class="empty">読み込み中…</div></div>
    </div>
    <div class="card" id="pickedCard" hidden>
      <div class="picked">
        <div><div class="n" id="pName"></div><div class="m" id="pMeta"></div></div>
        <button class="linkbtn" id="unpick" type="button">変更</button>
      </div>
    </div>
  </section>

  <section id="secNew" hidden>
    <div class="card">
      <div class="field"><label for="nName">商品名（日本語）</label><input id="nName" placeholder="例：ベイビーファットパヴェダイヤモンド"></div>
      <div class="field"><label for="nCode">品番<span class="opt">任意</span></label><input id="nCode" placeholder="例：BBY FAT P DMND" autocapitalize="characters"></div>
      <div class="field"><label for="nMat">素材</label>
        <select id="nMat"><option value="">選んでください</option><option>SILVER</option><option>22K/18K</option><option>APPAREL</option><option>OTHER</option></select></div>
      <div class="field" id="catWrap" hidden><label for="nCat">カテゴリ</label>
        <select id="nCat"><option value="">選んでください</option><option>TOP</option><option>CHAIN</option><option>RING</option><option>OTHER</option></select></div>
    </div>
  </section>

  <div class="card">
    <div class="field">
      <label for="price">価格（税込）</label>
      <div class="price-wrap"><span>¥</span><input id="price" inputmode="numeric" placeholder="324500" autocomplete="off"></div>
      <div class="check" id="check"></div>
      <label class="chk"><input type="checkbox" id="food"> 食品（軽減税率 8% で計算）</label>
    </div>
    <div class="field"><label for="date">確認日</label><input id="date" type="date"></div>
    <div class="field"><label for="memo">入力者・メモ<span class="opt">任意</span></label><input id="memo" placeholder="例：さむらいわーくす / 青山(東京)店"></div>
  </div>

  <button id="send" type="button" disabled>書き込む</button>
  <div id="toast" hidden></div>
</main>

<script>
// スプレッドシート（Apps Script）との通信。Googleのログイン状態に関係なく動くよう、ログイン情報を送らずに通信します
var API = 'https://script.google.com/macros/s/AKfycbzdBvuG7ICRVYeB0sepQpFRQ2yUYfWpWvSyhbkCiaYS5UOhNCUl5se9XFyEP17mT0ut/exec';
function callApi(method, body, ok, ng) {
  var opt = method === 'POST' ? { method: 'POST', body: JSON.stringify(body), credentials: 'omit' } : { credentials: 'omit' };
  fetch(method === 'POST' ? API : API + '?api=items&t=' + Date.now(), opt)
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.ok) { ok && ok(d.result); } else { ng && ng({ message: d.error }); } })
    .catch(function () { ng && ng({ message: '通信できませんでした。電波の良い場所でもう一度お試しください' }); });
}
var google = { script: { run: (function mk(ok, ng) {
  return {
    withSuccessHandler: function (h) { return mk(h, ng); },
    withFailureHandler: function (h) { return mk(ok, h); },
    getItems: function () { callApi('GET', null, ok, ng); },
    submit: function (p) { callApi('POST', p, ok, ng); }
  };
})(null, null) } };
</script>
<script>
var items = [], mode = 'upd', picked = null, filter = 'ALL', busy = false;
var GROUPS = [['ALL','すべて'],['SILVER','SILVER'],['22K/18K','22K/18K'],['APPAREL','アパレル'],['OTHER','その他']];
function $(id){ return document.getElementById(id); }
function fmt(n){ return Number(n).toLocaleString('ja-JP'); }
function norm(s){
  s = String(s || '').replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
  s = s.replace(/[ぁ-ゖ]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) + 0x60); });
  return s.toLowerCase().replace(/[\s　・]/g, '');
}
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function todayStr(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }

function load(){
  google.script.run.withSuccessHandler(function(list){ items = list; renderList(); })
    .withFailureHandler(function(e){ $('list').innerHTML = ''; $('list').appendChild(el('div','empty','読み込めませんでした：' + e.message)); })
    .getItems();
}

function renderChips(){
  var box = $('chips'); box.innerHTML = '';
  GROUPS.forEach(function(g){
    var b = el('button', g[0] === filter ? 'on' : '', g[1]); b.type = 'button';
    b.onclick = function(){ filter = g[0]; renderChips(); renderList(); };
    box.appendChild(b);
  });
}

function renderList(){
  var q = norm($('q').value), box = $('list'); box.innerHTML = '';
  var hits = items.filter(function(it){
    if (filter !== 'ALL' && it.material !== filter) return false;
    return !q || norm(it.name + it.code).indexOf(q) >= 0;
  });
  if (!hits.length){ box.appendChild(el('div','empty', q ? '見つかりません。「新しい商品」から追加できます' : '商品がありません')); return; }
  hits.slice(0, 80).forEach(function(it){
    var row = el('div','item');
    row.appendChild(el('div','n', it.name));
    var m = el('div','m');
    m.appendChild(document.createTextNode([it.material, it.category, it.code].filter(Boolean).join(' · ') + '　'));
    m.appendChild(it.price ? el('span','', '¥' + fmt(it.price)) : el('span','none','価格未登録'));
    row.appendChild(m);
    row.onclick = function(){ pick(it); };
    box.appendChild(row);
  });
  if (hits.length > 80) box.appendChild(el('div','empty','ほか ' + (hits.length - 80) + ' 件。検索で絞り込んでください'));
}

function pick(it){
  picked = it;
  $('pName').textContent = it.name;
  $('pMeta').textContent = [it.material, it.category, it.code].filter(Boolean).join(' · ') + '\n現在 ' +
    (it.price ? '¥' + fmt(it.price) : '価格未登録') + (it.date ? '（' + it.date + ' 確認）' : '');
  $('pMeta').style.whiteSpace = 'pre-line';
  $('food').checked = /チョコ|CHOCOLATE/i.test(it.name + it.code);
  $('searchCard').hidden = true; $('pickedCard').hidden = false;
  checkPrice(); validate();
  $('price').focus();
}
function unpick(){ picked = null; $('searchCard').hidden = false; $('pickedCard').hidden = true; validate(); }

function parsePrice(){
  return norm($('price').value).replace(/[,，¥￥円]/g, '');
}
function checkPrice(){
  var c = $('check'), raw = parsePrice();
  c.className = 'check'; c.textContent = '';
  if (!raw) return null;
  if (!/^\d+$/.test(raw)){ c.className = 'check ng'; c.textContent = '数字だけで入力してください'; return null; }
  var p = Number(raw), rate = $('food').checked ? 108 : 110;
  if (p > 0 && p % rate === 0){
    c.className = 'check ok'; c.textContent = '✓ 税抜 ¥' + fmt(p / rate * 100) + ($('food').checked ? '（8%）' : '');
    return p;
  }
  var lo = Math.floor(p / rate) * rate, hi = lo + rate;
  var ex = Math.floor(p * 100 / rate * 10) / 10;
  c.className = 'check ng';
  c.textContent = '税抜にすると ¥' + fmt(ex) + ' になり、百円単位になりません。' +
    (lo > 0 ? '¥' + fmt(lo) + ' か ¥' + fmt(hi) : '¥' + fmt(hi)) + ' ではありませんか？';
  return null;
}

function validate(){
  var ok = checkPrice() !== null;
  if (mode === 'upd') ok = ok && !!picked;
  else {
    var m = $('nMat').value;
    ok = ok && !!$('nName').value.trim() && !!m && ((m !== 'SILVER' && m !== '22K/18K') || !!$('nCat').value);
  }
  $('send').disabled = !ok || busy;
}

function setMode(m){
  mode = m;
  $('tabUpd').className = m === 'upd' ? 'on' : ''; $('tabNew').className = m === 'new' ? 'on' : '';
  $('secUpd').hidden = m !== 'upd'; $('secNew').hidden = m !== 'new';
  $('toast').hidden = true; validate();
}

function toast(text, ok){ var t = $('toast'); t.className = 'toast ' + (ok ? 'ok' : 'ng'); t.textContent = text; t.hidden = false; t.scrollIntoView({behavior:'smooth', block:'nearest'}); }

function send(){
  var price = checkPrice(); if (price === null || busy) return;
  busy = true; $('send').disabled = true; $('send').textContent = '書き込み中…';
  var p = { mode: mode, price: price, food: $('food').checked, date: $('date').value, memo: $('memo').value };
  if (mode === 'upd'){ p.row = picked.row; p.code = picked.code; p.itemName = picked.name; }
  else { p.name = $('nName').value; p.code = $('nCode').value; p.material = $('nMat').value; p.category = $('nCat').value; }
  google.script.run.withSuccessHandler(function(res){
      busy = false; $('send').textContent = '書き込む';
      items = res.items; toast('✓  ' + res.message, true);
      $('price').value = ''; $('nName').value = ''; $('nCode').value = ''; $('nMat').value = ''; $('nCat').value = ''; $('catWrap').hidden = true;
      $('food').checked = false; $('q').value = '';
      unpick(); renderList(); checkPrice(); validate();
    })
    .withFailureHandler(function(e){
      busy = false; $('send').textContent = '書き込む'; toast(e.message, false); validate();
    })
    .submit(p);
}

$('tabUpd').onclick = function(){ setMode('upd'); };
$('tabNew').onclick = function(){ setMode('new'); };
$('q').oninput = renderList;
$('unpick').onclick = unpick;
$('price').oninput = validate;
$('food').onchange = validate;
$('nName').oninput = validate;
$('nCat').onchange = validate;
$('nMat').onchange = function(){ var m = this.value; $('catWrap').hidden = !(m === 'SILVER' || m === '22K/18K'); if ($('catWrap').hidden) $('nCat').value = ''; $('food').checked = false; validate(); };
$('send').onclick = send;
$('date').value = todayStr();
renderChips(); load();
</script>
</body></html>
